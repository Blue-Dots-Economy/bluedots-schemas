name: validate-json

on:
  pull_request:
  push:
    branches: [main]

# Only the parse job gates a merge. The lint and drift jobs are advisory:
# they report on the PR so a reviewer sees the problem, but they always exit
# 0 and never hold the branch hostage.
#
# File lists are piped NUL-delimited with core.quotePath disabled. Without -z
# a path containing a space is word-split and silently skipped; without
# quotePath=false git escapes non-ASCII paths into a form that fails to open,
# which would report a valid file as invalid and block every merge.

jobs:
  parse:
    name: JSON parses (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate every tracked JSON file
        run: git -c core.quotePath=false ls-files -z '*.json' | node .github/scripts/validate-json.mjs

  network-lint:
    name: network.json structure (advisory)
    runs-on: ubuntu-latest
    needs: parse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint network.json cross-references
        run: git -c core.quotePath=false ls-files -z '*network.json' | node .github/scripts/lint-network.mjs --warn

  brand-drift:
    name: Brand clone drift (advisory)
    runs-on: ubuntu-latest
    needs: parse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Report drift between brand clones
        run: git -c core.quotePath=false ls-files -z '*network.json' | node .github/scripts/brand-drift.mjs
