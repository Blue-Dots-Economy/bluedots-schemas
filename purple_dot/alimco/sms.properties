# ALIMCO (Purple Dots) SMS templates.
#
# Source of truth: "PurpleDots_SMS_Templates_Categorised_final" sheet.
# Layered like the email copy: bundled defaults
# (Signals-DPG apps/api/src/notifications/sms/sms.default.properties)
# < network < brand. See apps/api/src/notifications/sms/sms_templates.ts.
#
# THREE KEYS PER CASE:
#   <case>.template_id  the DLT template id. BLANK below - nothing is registered
#                       with either vendor yet (notification-service#131), and a
#                       blank id makes dispatch_sms skip the send. Fill in as DLT
#                       approval lands. MSG91 reads it as the Flow id; Pinnacle
#                       sends it as `dlttempid`.
#   <case>.body         THE DELIVERED TEXT. ALIMCO sends through Pinnacle, which
#                       renders nothing: notification-service substitutes the
#                       {{tokens}} below and posts the result as `text`, with the
#                       DLT ids alongside for the operator to match on. This is
#                       not reference copy - it is what reaches the handset, so it
#                       must stay byte-identical to the registered template. The
#                       operator matches on the text and scrubs a mismatch
#                       silently. (On MSG91 the Flow API renders server-side and
#                       this field is unused - not our case.)
#   <case>.vars         the named variables the template expects. dispatch_sms
#                       forwards ONLY these (undeclared extras are dropped so
#                       stray PII cannot reach the wire) and warns on a missing one.
#                       On Pinnacle a missing one is fatal, not cosmetic: NS
#                       throws UnresolvedTemplateVariables rather than delivering
#                       a literal `{{token}}` to a handset.
#
# VARIABLE NAMES: the sheet numbers its variables positionally (var1 = Link).
# Both vendors need NAMED variables, so each label is bound to a name here:
#   Link -> link              OTP -> otp                 Service Name -> serviceName
#   Provider Org Name -> org  Phone Number -> phone      App Link -> appLink
#   Complaint/Support Request -> refType                 Ticket ID -> ticketId
# Register the DLT templates with these same names.
#
# VENDOR: ALIMCO sends through PINNACLE. Set `SMS_PROVIDER=pinnacle` on this
# deployment - notification-service defaults to msg91, and the two are not
# interchangeable: DLT ids are issued against the sending principal entity, so
# register ALIMCO's templates with Pinnacle's entity, not MSG91's. The
# deployment also needs PINNACLE_API_KEY, PINNACLE_SENDER_ID and
# PINNACLE_DLT_ENTITY_ID (see notification-service#132, #131).
#
# ENCODING - COSTS MONEY, FIX BEFORE REGISTERING: Pinnacle picks `messagetype`
# from the text (render.ts `messageType`): any character outside Latin-1 makes
# the whole message UNI, which bills at 67 characters per segment instead of
# GSM-7's 153. Every body below is currently UNI, for one reason only - the en
# dash in "- Team ALIMCO" is U+2013, not an ASCII hyphen (4 bodies also carry an
# em dash U+2014). That roughly doubles the segment count: 73 segments across
# these 35 templates, against 36 if the dashes were ASCII.
#
# The bodies below are kept verbatim from the sheet ON PURPOSE - they have to
# match whatever is registered with the operator. So the dashes must be changed
# in the SHEET first, before DLT registration; changing them only here would
# make the delivered text differ from the registered template.
#
# NOTE (Signals-DPG#719): per-provider ids are coming
# (`<case>.template_id.msg91` / `.pinnacle`), with the unsuffixed key staying as
# the fallback. The bodies and vars below do not change when that lands.
#
# NOTE: this file is INERT until Phase 2 - there is no SMS loader in
# packages/config and no event calls dispatchSms yet. See Signals-DPG#595.


# ==============================================================================
# Cases whose event already exists - these send as soon as a template_id lands.
# ==============================================================================

# Sheet splits sign-in and sign-up (sign-up carries the Terms/Privacy line),
# so they are two DLT templates and two cases. The live senders
# (packages/auth/src/config.ts, guardian_otp.ts) hardcode a single 'login_otp'
# id with one variable - they must be migrated to these before either is used.
# signin_otp_sms
login.otp.signin.template_id=
login.otp.signin.body={{otp}} is the OTP to verify your phone number on Purple Dots {{link}}. Please do not share this with anyone. This is valid for 5 mins. – Team ALIMCO
login.otp.signin.vars=otp,link

# signup_otp_sms
login.otp.signup.template_id=
login.otp.signup.body={{otp}} is the OTP to verify your phone number on Purple Dots {{link}}. Do not share with anyone. Valid for 5 mins. Read the Terms of Use and Privacy Policy on the app carefully. – Team ALIMCO
login.otp.signup.vars=otp,link

