# ALIMCO (Purple Dots) SMS templates.
#
# Source of truth: "PurpleDots_SMS_Templates_Categorised_final" sheet.
# Layered like the email copy: bundled defaults
# (Signals-DPG apps/api/src/notifications/sms/sms.default.properties)
# < network < brand. See apps/api/src/notifications/sms/sms_templates.ts.
#
# THREE KEYS PER CASE:
#   <case>.template_id  the DLT/MSG91 Flow id. BLANK below - none of these are
#                       registered yet, and a blank id makes dispatch_sms skip
#                       the send. Fill in per id as DLT approval lands.
#   <case>.body         REFERENCE ONLY - never sent. MSG91 renders from the
#                       DLT-approved template. Kept here for review, the dev
#                       preview log, and drift tests. Must stay byte-identical
#                       to the text registered with the operator.
#   <case>.vars         the named variables the DLT template expects. dispatch_sms
#                       forwards ONLY these (undeclared extras are dropped so
#                       stray PII cannot reach the wire) and warns on a missing one.
#
# VARIABLE NAMES: the sheet numbers its variables positionally (var1 = Link).
# MSG91 Flow needs NAMED variables, so each label is bound to a name here:
#   Link -> link              OTP -> otp                 Service Name -> serviceName
#   Provider Org Name -> org  Phone Number -> phone      App Link -> appLink
#   Complaint/Support Request -> refType                 Ticket ID -> ticketId
# Register the DLT templates with these same names.
#
# NOTE (Signals-DPG#719): a second vendor (Pinnacle) will need per-provider ids
# (`<case>.template_id.msg91` / `.pinnacle`), with the unsuffixed key staying as
# the fallback. The bodies and vars below do not change when that lands.
#
# NOTE: this file is INERT until Phase 2 - there is no SMS loader in
# packages/config and no event calls dispatchSms yet. See Signals-DPG#595.


# ==============================================================================
# Cases whose event already exists - these send as soon as a template_id lands.
# ==============================================================================

# Sheet splits sign-in and sign-up (sign-up carries the Terms/Privacy line),
# so they are two DLT templates and two cases. The live senders
# (packages/auth/src/config.ts, guardian_otp.ts) hardcode a single 'login_otp'
# id with one variable - they must be migrated to these before either is used.
# signin_otp_sms
login.otp.signin.template_id=
login.otp.signin.body={{otp}} is the OTP to verify your phone number on Purple Dots {{link}}. Please do not share this with anyone. This is valid for 5 mins. – Team ALIMCO
login.otp.signin.vars=otp,link

# signup_otp_sms
login.otp.signup.template_id=
login.otp.signup.body={{otp}} is the OTP to verify your phone number on Purple Dots {{link}}. Do not share with anyone. Valid for 5 mins. Read the Terms of Use and Privacy Policy on the app carefully. – Team ALIMCO
login.otp.signup.vars=otp,link

